name: Build unsigned IPA

# Derived MVP (see QWEN.md): Windows-first pipeline.
# Reuses the existing upstream build path (build.sh / ci_scripts commands):
# xcodegen -> xcodebuild, CODE_SIGNING_ALLOWED=NO (no Apple signing), zip
# Payload -> BTRemote.ipa, uploaded as a downloadable artifact.
# The existing build.yml (signed release via fastlane with the upstream
# author's Apple account) is kept untouched.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap (xcodegen + Bluetooth json resources)
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          fi
          xcode-select -p
          bash ci_scripts/ci_post_clone.sh

      - name: Test (SPEC §5.2 dependency-free Swift checks)
        run: |
          set -o pipefail
          mkdir -p .build
          swiftc -swift-version 6 \
              BTRemote/LowEnergy/HIDReports.swift \
              BTRemote/LowEnergy/HIDProfile.swift \
              BTRemote/GyroAim.swift \
              BTRemoteTests/GamepadTests.swift \
              -o .build/gamepad-tests
          .build/gamepad-tests

      - name: Test TV protocol, library, sessions and certificate (SPEC c2ab72d §7.3)
        run: |
          set -o pipefail
          swiftc -swift-version 6 \
              BTRemote/TVWire.swift \
              BTRemote/TVLibrary.swift \
              BTRemote/TVLibraryStore.swift \
              BTRemote/TVIdentity.swift \
              BTRemote/TVRemoteClient.swift \
              BTRemote/RemoteTargetSession.swift \
              BTRemoteTests/TVTests.swift \
              -o .build/tv-tests
          # Synthetic loopback TLS server exercises the production Security callback.
          # The temporary test key/certificate never enter the application or artifacts.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -subj '/CN=TV-callback-test' \
              -keyout .build/tv-test-key.pem -out .build/tv-test-cert.pem >/dev/null 2>&1
          openssl s_server -accept 127.0.0.1:46466 \
              -cert .build/tv-test-cert.pem -key .build/tv-test-key.pem \
              -www -quiet >.build/tv-tls-fixture.log 2>&1 &
          tls_fixture_pid=$!
          trap 'kill "$tls_fixture_pid" 2>/dev/null || true' EXIT
          TV_TLS_PROBE_PORT=46466 .build/tv-tests

      - name: Build unsigned (no Apple signing; same xcodebuild as build.sh)
        run: |
          set -o pipefail
          xcodebuild \
              -project BTRemote.xcodeproj \
              -scheme BTRemote \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath .build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee .build/xcodebuild.log | xcbeautify

      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-build-diagnostics
          path: .build/xcodebuild.log
          if-no-files-found: ignore

      - name: Package unsigned ipa (Payload zip; unsigned, re-sign on device via SideStore)
        run: |
          rm -rf .build/Payload
          mkdir -p .build/Payload build
          cp -R .build/DerivedData/Build/Products/Release-iphoneos/BTRemote.app .build/Payload/
          cd .build/
          /usr/bin/zip -qry ../build/BTRemote.ipa Payload

      - name: Upload unsigned ipa
        uses: actions/upload-artifact@v4
        with:
          name: btr-remote-unsigned-ipa
          path: build/BTRemote.ipa
          if-no-files-found: error
