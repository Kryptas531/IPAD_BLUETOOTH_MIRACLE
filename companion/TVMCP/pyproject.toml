# Python >=3.12. Exact reference revision pinned per SPEC 52d93f1 section 7.3 H.
# androidtvremote2 = Apache-2.0 (canonical reference); mcp SDK = MIT.
# This project's own code stays AGPL-3.0-only (repo LICENSE); these are NOT iPad dependencies.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-mcp"
version = "0.1.0"
description = "Windows laptop reference remote and local stdio MCP server for Android TV Remote v2 (SPEC 7.3 H)"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "androidtvremote2 @ git+https://github.com/tronikos/androidtvremote2.git@b09f21432ba33e42536215a8f41641d801cf6a2c",
    "mcp>=1,<2",
]

[project.scripts]
tv-mcp = "tv_mcp.__main__:main"

[tool.setuptools]
packages = ["tv_mcp"]
